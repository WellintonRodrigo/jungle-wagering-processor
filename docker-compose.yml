
services:
  postgres:
    image: postgres:17-alpine
    container_name: jungle-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_dev
      POSTGRES_DB: jungle_wagering

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4.12.0
    container_name: jungle-localstack
    restart: unless-stopped

    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"

    ports:
      - "4566:4566"

    volumes:
      - localstack_data:/var/lib/localstack

    healthcheck:
      test:
        - CMD-SHELL
        - "curl -fsS http://localhost:4566/_localstack/health > /dev/null"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  localstack_data:
